name: Test with pytest

# on: push

# by adding this we can add multiple events to trigger this workflow
# workflow_dispatch means now we can manually run workflow from github

# on: ["push", "workflow_dispatch"]



# Event activity types and filters
on:
  # workflow will be triggered on pull request
  pull_request:

    # when will be this workflow will be triggered
    # this means when branch is opened
    types:
      - opened

  # we can add it like this without mentiong any value to it
  workflow_dispatch:
  
  # this will mean it will trigger the workflow when 
  # we push to these branches and we can also add this branch filter to pull_request section above
  push:
    branches:
      - main
      # this covers like dev-v1, dev-v2...
      - 'dev-*'
      # this covers like this also dev-v1/v2, dev-v1/v2/v3
      - 'dev-**'

jobs: 
  test:
    runs-on: ubuntu-latest
    steps:
      # so the workflow runs on a machine that does not have our code
      # so the first step is to download it
      - name: Get code

        # so we are using an action here 
        # @v3 is the version so we do not use some updated version
        # os by default it will download our code so we do not have to change the configuration
        uses: actions/checkout@v7
        # some actions require some configuratin so we can add that "with" keyword
        # with:
        #   ... 

      
      # now we have to download python, libraries to run the testcases
      # so as are using ubuntu-latest we already have python
      
      # but we still download python ** JUST TO PRACTICE

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      
      # now we are downloading packages
      - name: Downloading packages
        run: pip install pytest

      # run testcase
      - name: Run testcases
        run: pytest

  # just added one more job to practice same as previous one
  deploy:

    # this check tells that it should go after job test
    # otherwise it is going to run in parallel
    # we can also add that it should wait for multiple jobs

    # now advantage if previous job fails it will not going to run new job
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code

        uses: actions/checkout@v7

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Downloading packages
        run: pip install pytest

      - name: Run testcases
        run: pytest

      - name: Output Github context

        # This step prints all available GitHub context information in JSON format in the GitHub Actions execution logs.
        # github is a predefined GitHub context object.
        # ${{ }}: Evaluates GitHub Actions expressions
        
        run: echo "${{ toJSON(github) }}"
      